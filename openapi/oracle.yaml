          description: Production
        - url: 'http://localhost:9998/v1'
          description: Development (port ORCL)
    put:
      tags:
        - Address
      summary: Subscribe Address
      description: |-
        Subscribe for balance and transaction data on a given address.

        If the "normalization" of an address mangles it, set the `address` field.
        It is otherwise optional.

        If an address subscription is older than 30 days, then it may be deleted automatically.
        You can subscribe addresses periodically to avoid this.
      operationId: subscribe-address
      parameters:
        - name: Organization
          in: header
          description: Requester's identity
          required: true
          schema:
            type: string
        - name: chain
          in: path
          required: true
          schema:
            type: string
        - name: address
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: |
          Subscribes the organization to the specified address.

          Creating an address puts it on the oracle's watchlist, it will backfill and start adding transactions as they occur.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Address'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
      servers:
        - url: 'https://oracle.cordialapis.com/v1'
          description: Production
        - url: 'http://localhost:9998/v1'
          description: Development (port ORCL)
    get:
      tags:
        - Address
      summary: Get Address
      operationId: get-address
      parameters:
        - name: Organization
          in: header
          description: Requester's identity
          required: true
          schema:
            type: string
        - name: chain
          in: path
          required: true
          schema:
            type: string
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
