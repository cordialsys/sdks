openapi: 3.1.0
info:
  version: '1.0'
  title: Cordial Oracle
  summary: Cordial Oracle
  description: |
    This module is also used by the end users to specify which addresses to listen to.
    Once the user subscribes to an address, then related transactions and balance updates will start being tracked.

    All the endpoints, including subscribing and unsubscribing, are idempotent 
    so users can send multiple identical requests without errors.

    If an address subscription is older than 30 days, then it may be deleted automatically.
    You can subscribe addresses periodically to avoid this.

    Each endpoint multi-tenant, and segregated by organization identity, which means the requestor can 
    never access the list of addresses, balances, or transactions of the other organizations.

    ### Organization Identity

    The organization identity is specified by a header `Organization` or a query parameter `organization`.

    This service, as all others, is guarded by the Auth API. It sets and/or verifies the organization identity of the request.

    An end user either uses an API key (generated in the Admin API, and tied to a specific organization),
    or an access token (generated via login to the Auth API and tied to a specific user).

    In case an access token is used, and the user happens to be in multiple organizations,
    the user can specify the desired organization ID via header or query parameter.

    ### Pagination

    The API also supports pagination as the list of transactions and even balances can 
    be very long. The pagination is implemented following to https://google.aip.dev/158 
    with minor differences: **users cannot change page size once the page token is generated 
    and there can be slightly more elements returned than asked.**  
    These deviations were necessary due to a versatile set of pagination mechanisms used by 
    the third-party providers and we had to fit them under a single pagination mechanism.

    The pagination is encapsulated from the user via the page token mechanism.  
    The page token is a base64 string that holds the pagination info like page size and offset, 
    but its structure can be different for each provider, that's why the token is obfuscated 
    via base64.

    To use the pagination user can specify an optional `page_size` query parameter. 
    The response will then contain a `next_page_token` field that should be passed as a `page_token` 
    query parameter to retrieve the next page.
    If the returned next page token is empty it means there are no more elements left.
servers:
  - url: 'https://oracle.cordialapis.com/v1'
    description: Production
  - url: 'http://localhost:9998/v1'
    description: Development (port ORCL)
paths:
  /assets:
    get:
      tags:
        - Asset
      summary: List Assets
      description: List all the assets tracked by Oracle
      operationId: list-assets
      parameters:
        - name: page_size
          in: query
          description: Amount of elements to return per page
          schema:
            type: integer
        - name: page_token
          in: query
          description: Pagination token returned from the previous request
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
      servers:
        - url: 'https://oracle.cordialapis.com/v1'
          description: Production
        - url: 'http://localhost:9998/v1'
          description: Development (port ORCL)
