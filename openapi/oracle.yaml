          properties:
            assets:
              type: array
              items:
                $ref: '#/components/schemas/Asset'
        - $ref: '#/components/schemas/Pagination'
      x-tags:
        - Page
    Asset:
      type: object
      title: Asset
      properties:
        name:
          $ref: '#/components/schemas/AssetName'
        decimal:
          type: integer
          format: int64
          minimum: 0
          default: 0
          examples:
            - 8
        alternative_identifiers:
          type: object
          additionalProperties:
            type: string
      x-tags:
        - Resource
    AssetName:
