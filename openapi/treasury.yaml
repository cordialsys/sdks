    TransferRulePage:
      title: TransferRulePage
      allOf:
        - type: object
          properties:
            transfer-rules:
              type: array
              items:
                $ref: '#/components/schemas/TransferRule'
        - $ref: '#/components/schemas/Pagination'
      x-tags:
