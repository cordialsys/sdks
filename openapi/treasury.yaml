    StakingRule:
      title: StakingRule
      description: |
        This is analogou to transfer rules, except the `to` address must be a `validator` address.
      examples:
        - name: transfer-rules/simple-btc-allowlist-account
          variant: allow
          asset: chains/BTC/assets/BTC
          from: accounts/x
          to: accounts/y
          version: 1
        - name: transfer-rules/simple-btc-allowlist-addresses
          variant: allow
          asset: chains/BTC/assets/BTC
          from: accounts/x
          to:
            - chains/BTC/addresses/bc1pylz76fj9tcscnqk0gzfux87aguh3lxpnq5fyvyu9h99668wtufds479h8t
            - chains/BTC/addresses/bc1pylz76fj9tcscnqk0gzfux87aguh3lxpnq5fyvyu9h99668wtufds479h8t
          version: 1
        - name: transfer-rules/multi-asset
          variant: allow
          asset:
            - chains/BTC/assets/BTC
            - chains/ETH/assets/ETH
            - chains/ETH/assets/0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
          from: accounts/x
          to: accounts/y
          version: 1
        - name: transfer-rules/deny-btc-out-of-account-x
          variant: deny
          asset:
            - chains/BTC/assets/BTC
          from: accounts/x
          to: any/address
          version: 1
        - name: transfer-rules/require-2-approvals-account-x
          variant: require
          asset: any/asset
          from: accounts/x
          to: any/address
          approve:
            - roles/admin
            - users/joesmith
          approvals: 2
          version: 1
        - name: transfer-rules/sent-to-default-address
          variant: allow
          asset: chains/BTC/assets/BTC
          from: accounts/x
          to: accounts/coinbase/defaults
          version: 1
      allOf:
        - type: object
          properties:
            name:
              $ref: '#/components/schemas/StakingRuleName'
              description: OUTPUT ONLY.
            variant:
              $ref: '#/components/schemas/RuleVariant'
            state:
              $ref: '#/components/schemas/DisableableState'
              description: OUTPUT ONLY.
        - $ref: '#/components/schemas/Metadata'
        - $ref: '#/components/schemas/StakingRuleData'
      x-tags:
        - Resource
