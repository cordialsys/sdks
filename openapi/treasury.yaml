openapi: 3.1.0
info:
  version: '1.0'
  title: Cordial Treasury
  summary: Programmatic API for Cordial Treasury
  description: |-
    The Cordial Treasury programmatic API offers a resource-oriented REST API.

    Each resource (such as `Account`, `Address`, `Transfer`, `User`) has CRUD endpoints exposed.

    Top-level resources have a
    - type `Resource` (singular)
    - collection ID `<resources>` (plural)
    - resource ID `{resource}`
    - resource name `/<resources>/{resource}`

    The resource ID is resource-specific, but always URL-safe and may only contain ASCII letters, ASCII digits, underscores, and dashes (`A-Za-z0-9_-`).

    Resources may offer the following standard operations:
    - Create Resource (not specifying resource ID) as `POST` to endpoint `/<resources>`
    - Create Resource (specifying resource ID) as `PUT` to endpoint `/<resources>/{resource}`
    - List Resources as `GET` to endpoint `/<resources>`
    - Get Resource as `GET` to endpoint `/<resources>/{resource}`
    - Update Resource as `PUT` to endpoint `/<resources>/{resource}`
    - Delete Resource as `DELETE` to endpoint `/<resources>/{resource}`

    Note that, for operations on existing resources, the endpoint path and resource name correspond. For example, a user with user name `someone@example.com` may have resource name `users/31725`, and can be retrieved via `GET` request to `<API base URL>/users/31725`.

    Some resources naturally have parent resources, for instance an `Address` resource always has a parent `Chain` resource. In this case the resource name reflects this nesting, as do the corresponding endpoints for Get, Update, and Delete.

    The read-only operations Get and List directly return the corresponding resource or list of resources.

    Write operations may require approvals by other human or machine users. Therefore, operations Create, Import, Update, and Delete return the special `Operation` resource, which is
    - referenced by other users to
      - approve via `POST` to`/operations/{operation}/approve`, or
      - challenge via `POST` to `/operations/{operation}/challenge`
    - polled via `GET` to `/operations/{operation}` to eventually return the requested resource.

    Resources "exist" (are assigned a resource name, listed via List and retrievable via Get) as soon as there are sufficiently many approvals.

    There are two layers of authentication:
    - Web2 authentication, giving read access
    - Web3 authentication, giving write access as configured by the IAM and policy system
