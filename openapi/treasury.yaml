components:
  schemas:
    AccountPage:
      title: AccountPage
      allOf:
        - type: object
          properties:
            accounts:
              type: array
              items:
                $ref: '#/components/schemas/Account'
        - $ref: '#/components/schemas/Pagination'
      x-tags:
        - Page
    Account:
      title: Account
      allOf:
        - type: object
          properties:
            name:
              $ref: '#/components/schemas/AccountName'
              description: OUTPUT ONLY.
            variant:
              $ref: '#/components/schemas/AddressVariant'
            state:
              $ref: '#/components/schemas/BasicState'
              description: OUTPUT ONLY.
        - $ref: '#/components/schemas/Metadata'
        - $ref: '#/components/schemas/AccountData'
      x-tags:
        - Resource
    AccountName:
      type: string
      title: AccountName
      pattern: 'accounts/[A-Za-z0-9-_]+'
      examples:
        - accounts/binance
      x-tags:
        - Name
    AddressVariant:
      type: string
      enum:
        - internal
        - shared
        - external
      title: AddressVariant
      description: |-
        Internal means the engine has the key, external means it does not.
        Shared means the engine has the key, but it can also be used in Create Signature.
      x-tags:
        - Variant
    BasicState:
      type: string
      enum:
        - active
        - deleted
      title: BasicState
      description: Active / deleted state for resources that don't have a more specific state machine.
      x-tags:
        - State
    Metadata:
      type: object
      title: Metadata
      properties:
        creator:
          $ref: '#/components/schemas/UserName'
        create_time:
          $ref: '#/components/schemas/Timestamp'
          description: OUTPUT ONLY.
        updater:
          $ref: '#/components/schemas/UserName'
        update_time:
          $ref: '#/components/schemas/Timestamp'
        version:
          $ref: '#/components/schemas/ResourceVersion'
          description: OUTPUT ONLY. Increment each time the resource is modified. Plays the same role as ETag (entity tag) in HTTP.
        labels:
          $ref: '#/components/schemas/Labels'
          description: string or null values (latter indicating tags)
        notes:
          $ref: '#/components/schemas/Notes'
          description: string values.
      x-tags:
        - Value
    UserName:
      type: string
      title: UserName
      description: The resource name for a user.
      pattern: 'users/[A-Za-z0-9-_]+'
      examples:
        - users/admin-2
      x-tags:
        - Name
    Timestamp:
      type: string
      title: Timestamp
      description: |-
        Seconds since UNIX epoch, encoded as UTC timestamp (ending in Z).

        All resources have a `create_time` timestamp, which is set to the engine block time where the resource
        is created in replicated engine state.
      pattern: '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z'
      examples:
        - '2024-07-30T11:30:15Z'
      x-go-type: time.Time
      x-go-type-import.path:
        path: time
      x-tags:
        - Value
    ResourceVersion:
      type: integer
      title: ResourceVersion
      minimum: 0
      x-tags:
        - Value
    Labels:
      type: object
      title: Labels
      description: |-
        Similar to "labels" in Kubernetes, stores "identifying data" of a resource. Values are strings, or null (for "tags"). It is recommended to namespace using a domain.

        Standard labels:
        - `creator`
        - `sso`
      additionalProperties:
        type: string
      examples:
        - sso: joe@cocker.com
          update-time: '2024-01-26T01:22:33Z'
      x-go-type: custom.SafeMap
      x-go-type-import.path:
        path: github.com/cordialsys/engine/types/custom
      x-tags:
        - Value
    Notes:
      type: object
      title: Notes
      description: |-
        Similar to "annotations" in Kubernetes, stores "non-identifying data" ofa resource. Values are strings. It is recommended to namespace using a domain.
        Standard labels:
        - `description`
        - `email`
        - `display-name`
      additionalProperties:
        type: string
      examples:
        - description: My first resource
          display-name: Cat Power
      x-go-type: custom.SafeMap
      x-go-type-import.path:
        path: github.com/cordialsys/engine/types/custom
      x-tags:
        - Value
    AccountData:
      type: object
      title: AccountData
      description: 'An account is a container for addresses. Adding or removing an address should usually be permissioned, as transfer rules may be formulated in terms of accounts, and have cascading effects on addresses.'
      properties:
        addresses:
          type: array
          description: The addresses belonging to this account.
          items:
            $ref: '#/components/schemas/AddressName'
        defaults:
          $ref: '#/components/schemas/DefaultAddresses'
      x-ResourceType: Account
      x-tags:
        - Data
    AddressName:
      type: string
      title: AddressName
      description: 'The name of an address consists of its (parent) chain name, its on-chain representation, and optionally a memo, separated by a `+`. In case the memo is not a valid ID, it will be mangled.'
      pattern: 'accounts/[A-Za-z0-9-_]+(+[A-Za-z0-9-_]+)?'
      examples:
        - chains/SOL/addresses/AAPGdMUVxGJqbY1gg6jMA7hnQdSzDtfcW4DPAVL56L9w
        - chains/ATOM/addresses/cosmos13dd5eahz5xkytny9dqnpre7488hm7ahsnadr3w
        - chains/ETH/addresses/0x2bc0dde194d722fe98ed3912cad464380f2225ac
        - chains/ATOM/addresses/cosmos13dd5eahz5xkytny9dqnpre7488hm7ahsnadr3w+memo
