  /healthy:
    get:
      tags:
        - Observability
      summary: Healthy
      description: |-
        Called directly, this endpoint returns an auto-refreshing HTML page,
        which is green (HTTP 200) if all checks passed,
        and red (HTTP 503) is any checks failed.

        A correct monitoring client SHOULD call the endpoint unadorned, and alert:
        - when request itself fails, or
        - when the HTTP status code is not 200

        Infrastructure operators can then use the verbose output to resolve the issue(s).

        ### Details
        With the query parameter `?verbose`, it returns JSON data with
        all checks and their outcomes for all checked components.

        **The content of this "verbose" output is currently NOT AT ALL covered by API stability guarantees.**

        Example:
        ```json
        {
          "api": {
            "pass": []
          },
          "backup": {
            "pass": [
              "snapshot"
            ]
          },
          "connector": {
            "pass": [
              "enrolled",
              "treasury"
            ],
            "fail": {
              "oracle-api": "could not use oracle API: Unauthenticated: Neither access token nor API key passed"
            }
          },
          "engine": {
            "pass": [
              "consensus",
              "time",
              "validators"
            ]
          },
          "signer": {
            "pass": [
              "enrolled",
              "s2s-connectivity-1-2",
              "treasury"
            ]
          }
        }
        ```
      operationId: healthy
      parameters:
        - name: verbose
          in: query
          description: 'set this parameter to see the underlying checks, and reasons for the fails'
          schema:
            type: string
      responses:
        '200':
          description: Treasury is healthy
          content:
            text/html:
              schema:
                type: object
        '503':
          description: Treasury is not healthy
      servers:
        - url: 'https://treasury.cordialapis.com/v1'
          description: Production
        - url: 'http://localhost:8777/v1'
          description: Development (port TRSR)
