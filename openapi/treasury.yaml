    TransferRulePage:
      title: TransferRulePage
      allOf:
        - type: object
          properties:
            transfer-rules:
              type: array
              items:
                $ref: '#/components/schemas/TransferRule'
        - $ref: '#/components/schemas/Pagination'
      x-tags:
        - Page
    TransferRule:
      title: TransferRule
      description: |
        The three components `asset`, `from`, and `to` are required.

        A transfer allow rule applies to an address-to-address transfer if all of below are true

        - asset match:
          - rule.asset is wildcard ("any/asset"), or
          - rule.asset equals or contains transfer.asset.
        - from match:
          - rule.from is wildcare ("any/address"), or
          - rule.from equals or contains transfer.account, or
          - rule.from equals or contains transfer.address
        - to match: see from match.

        In order for a transfer to be allowed, the following must be true:
        - At least one matching ALLOW rule must pass
        - All matching REQUIRE rules must pass
        - All matching DENY rules must fail

        Access controls and approval quoroms may be set on transfer rules.  Use this to control
        different roles, users, or approval requirements based on addresses, accounts, and/or assets.

        ### Default addresses

        A `to` filter in a transfer rule may opt to use a default address in a target account by appending `/defaults` to the account name.  This will evaluate to a single address depending on the default address set on the respective `Account` for the given asset or chain being transferred.

        **Example**: Sending to default address(es) on "coinbase" account.

        ```text
        Account {
          "name": "accounts/coinbase",
          "defaults": {
            "chains/ETH": "chains/ETH/addresses/0xAA",
            "chains/ETH/assets/0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48": "chains/ETH/addresses/0xBB"
          }
        }
        ```

        If we create a transfer rule with `to` set to `accounts/coinbase/defaults`, then this permits sending to default addresses on `coinbase` account.

        If we send [USDC](https://etherscan.io/token/0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48) to `0xBB`, it will be allowed.  If we send any other permitted asset to `0xAA`, it will be allowed.  If we try sending a permitted asset to an address not set as a default, however, it will not be allowed.

        Sending USDC to `0xAA` in this example would **not** be allowed, as only the most specific match (USDC matches `0xBB` first) will get used as the allowed destination for a given transfer asset.

        ### Notional limits

        Transfer amounts may be limited according to supported quote currencies (e.g. USD).

        More on this coming soon.
      examples:
        - name: transfer-rules/simple-btc-allowlist-account
          variant: allow
          asset: chains/BTC/assets/BTC
          from: accounts/x
          to: accounts/y
          version: 1
        - name: transfer-rules/simple-btc-allowlist-addresses
          variant: allow
          asset: chains/BTC/assets/BTC
          from: accounts/x
          to:
            - chains/BTC/addresses/bc1pylz76fj9tcscnqk0gzfux87aguh3lxpnq5fyvyu9h99668wtufds479h8t
            - chains/BTC/addresses/bc1pylz76fj9tcscnqk0gzfux87aguh3lxpnq5fyvyu9h99668wtufds479h8t
          version: 1
        - name: transfer-rules/multi-asset
          variant: allow
          asset:
            - chains/BTC/assets/BTC
            - chains/ETH/assets/ETH
            - chains/ETH/assets/0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
          from: accounts/x
          to: accounts/y
          version: 1
        - name: transfer-rules/deny-btc-out-of-account-x
          variant: deny
          asset:
            - chains/BTC/assets/BTC
          from: accounts/x
          to: any/address
          version: 1
        - name: transfer-rules/require-2-approvals-account-x
          variant: require
          asset: any/asset
          from: accounts/x
          to: any/address
          approve:
            - roles/admin
            - users/joesmith
          approvals: 2
          version: 1
        - name: transfer-rules/sent-to-default-address
          variant: allow
          asset: chains/BTC/assets/BTC
          from: accounts/x
          to: accounts/coinbase/defaults
          version: 1
      allOf:
        - type: object
          properties:
            name:
              $ref: '#/components/schemas/TransferRuleName'
              description: OUTPUT ONLY.
            variant:
              $ref: '#/components/schemas/RuleVariant'
            state:
              $ref: '#/components/schemas/DisableableState'
              description: OUTPUT ONLY.
        - $ref: '#/components/schemas/Metadata'
        - $ref: '#/components/schemas/TransferRuleData'
      x-tags:
        - Resource
