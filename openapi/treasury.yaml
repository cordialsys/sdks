      title: EthHex
      description: |-
        Ethereum has a few parameters that are "binary data" (possibly numerical, such as the u64 chain ID) but accept multiple input encodings:
        - `<number>` (if it fits in a JavaScript number)
        - `"<number>"` (if it fits in a JavaScript number)
        - `"0x<hex>"`

        The last one is in some sense the most general and hence canonical encoding.

