components:
  parameters:
    page_size:
      name: page_size
      in: query
      description: The page size to download.
      required: false
      schema:
        type: integer
    page_token:
      name: page_token
      in: query
      description: The token to load the next page from.
      required: false
      schema:
        type: string
    filter:
      name: filter
      in: query
      description: 'A filter to apply before filling out the page (https://docs.cordialsystems.com/reference/filtering).'
      required: false
      schema:
        type: string
    output:
      name: output
      in: query
      description: Download in a output format (`csv` or `pdf`).
      required: false
      schema:
        type: string
    page_number:
      name: page_number
      in: query
      description: 'Retrieves the Nth page of data. '
      required: false
      schema:
        type: integer
  responses:
    OperationNameJson:
      description: 'The name of the operation created, which can be queried for.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationName'
  schemas:
    AccountPage:
      title: AccountPage
      allOf:
        - type: object
          properties:
            accounts:
              type: array
              items:
                $ref: '#/components/schemas/Account'
        - $ref: '#/components/schemas/Pagination'
      x-tags:
        - Page
    Account:
      title: Account
      allOf:
        - type: object
          properties:
            name:
              $ref: '#/components/schemas/AccountName'
              description: OUTPUT ONLY.
            variant:
              $ref: '#/components/schemas/AddressVariant'
            state:
              $ref: '#/components/schemas/BasicState'
              description: OUTPUT ONLY.
        - $ref: '#/components/schemas/Metadata'
        - $ref: '#/components/schemas/AccountData'
      x-tags:
        - Resource
    AccountName:
      type: string
      title: AccountName
      pattern: 'accounts/[A-Za-z0-9-_]+'
      examples:
        - accounts/binance
      x-tags:
        - Name
    AddressVariant:
      type: string
      enum:
        - internal
        - shared
        - external
        - contract
        - validator
      title: AddressVariant
      description: |-
        `internal` means the engine has the key, `external` means it does not.
        The `shared` variant is deprecated: it meant that the `key` was `shared` and hence allowed use via the (dangerous) raw signing API. There is now an `allow_dangerous_raw_signing` flag instead.
      x-tags:
        - Variant
    BasicState:
      type: string
      enum:
        - active
        - deleted
      title: BasicState
      description: Active / deleted state for resources that don't have a more specific state machine.
      x-tags:
        - State
    Metadata:
      type: object
      title: Metadata
      properties:
        creator:
          $ref: '#/components/schemas/UserName'
        create_time:
          $ref: '#/components/schemas/Timestamp'
          description: OUTPUT ONLY.
        updater:
          $ref: '#/components/schemas/UserName'
        update_time:
          $ref: '#/components/schemas/Timestamp'
        version:
          $ref: '#/components/schemas/ResourceVersion'
          description: OUTPUT ONLY. Increment each time the resource is modified. Plays the same role as ETag (entity tag) in HTTP.
        labels:
          $ref: '#/components/schemas/Labels'
          description: |-
            Labels are indexed, meaning they are fast to query when filtering for them.

            Labels with a `uid.` prefix will have a unique constraint,
            meaning no two resources of the same type may have the same `uid.<key>=<value>` (added in `25.9.4`).
        notes:
          $ref: '#/components/schemas/Notes'
          description: string values.
        tags:
          $ref: '#/components/schemas/Tags'
        description:
          type: string
          description: Added in `25.12.1`.  A searchable description for the resource.
        proposal:
          $ref: '#/components/schemas/Proposal'
      x-tags:
        - Value
    UserName:
      type: string
      title: UserName
      description: The resource name for a user.
      pattern: 'users/[A-Za-z0-9-_]+'
      examples:
        - users/admin-2
      x-tags:
        - Name
    Timestamp:
      type: string
      title: Timestamp
      description: |-
        Seconds since UNIX epoch, encoded as UTC timestamp (ending in Z).

        All resources have a `create_time` timestamp, which is set to the engine block time where the resource
        is created in replicated engine state.
      pattern: '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z'
      examples:
        - '2024-07-30T11:30:15Z'
      x-go-type: time.Time
      x-go-type-import.path:
        path: time
      x-tags:
        - Value
    ResourceVersion:
      type: integer
      title: ResourceVersion
      minimum: 0
      x-tags:
        - Value
    Labels:
      type: object
      title: Labels
      description: |-
        Similar to "labels" in Kubernetes, stores "identifying data" of a resource. Values are strings, or null (for "tags"). It is recommended to namespace using a domain.

        Standard labels:
        - `creator`
        - `sso`
      additionalProperties:
        type:
          - string
          - 'null'
      examples:
        - sso: joe@cocker.com
          update-time: '2024-01-26T01:22:33Z'
      x-go-type: SafeMap
      x-tags:
        - Value
    Notes:
      type: object
      title: Notes
      description: |-
