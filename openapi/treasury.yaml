          required:
            - initiator
        - type: object
          properties:
            request:
              $ref: '#/components/schemas/Request'
        - type: object
          properties:
            response:
              $ref: '#/components/schemas/Response'
            error:
              $ref: '#/components/schemas/Error'
            effects:
              type: array
              description: |-
                `EXPERIMENTAL` An operation may be "compound", meaning multiple resources are modified.
                This will contain the list of responses, for each modified resource.
                It is ordered in order of modification, and always includes `.response`.

                This is omitted if an operation is not compound.
              items:
                $ref: '#/components/schemas/Response'
              x-experimental: true
      x-tags:
        - Data
