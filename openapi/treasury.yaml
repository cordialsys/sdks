        Implicitly, the type of the value of a field has to match.

        Using non-data fields (like name, state, variant, metadata) is explicitly excluded and invalid.

        Currently, we may only support primitive types (integer, string, boolean) as values, and top-level keys.
      x-go-type: SafeMapAny
