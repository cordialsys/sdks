  /events:
    get:
      tags:
        - Events
      summary: Events
      description: |-
        This is a websocket, which sends newline-delimited JSON events for each change of the engine state.

        Example:
        ```
        {"height":172,"time":"2024-06-05T22:55:33Z","action":"create","type":"Operation","resource":{"approve":[],"cancel":[],"create_time":"2024-06-05T22:55:33Z","initiator":"users/signer-1","name":"operations/4DF5FA45288492B7C74E4093365D0197A5EDBC25FA46CE32F06BF788B3DC3470","request":{"action":"create","api":1,"body":"{\"active_time\":\"1970-01-01T00:00:00Z\"}","create_time":1717628133,"extension":"","id":"","nonce":6480961236271,"operation":"","parent":"signer-1","public_key":"03410ef7bd3e2e78f18fbd858eb497911849ee91b87cd72b483f3a7fea1f5d1790","query":{},"resource":"Heartbeat","signature":"f99f0c3d5404af813f4e557c57704bd6bfd4cea77ca6c630ddd28844b4bc4ce3333402ebfac153f8f0d2c32aa1c68faeac553125aa12cfb47e786273080bf088","treasury":"Qj3uUa7fhAcrDsFWwRSzVN","vote":""},"state":"authorizing","update_time":"2024-06-05T22:55:33Z","version":1}}
        {"height":172,"time":"2024-06-05T22:55:33Z","action":"create","type":"Heartbeat","resource":{"name":"users/signer-1/heartbeats/1","active_time":"2024-06-05T22:54:23Z"}}
        {"height":176,"time":"2024-06-05T22:55:43Z","action":"create","type":"Operation","resource":{"approve":[],"cancel":[],"create_time":"2024-06-05T22:55:43Z","initiator":"users/root","name":"operations/993BCF0645B804B982D8559BFD81D1E076FF7DE3B49CEDFC3F816561E375E24F","request":{"action":"create","api":1,"body":"{\"variant\":\"machine\"}","create_time":1717628143,"extension":"","id":"machine","nonce":9006573486740,"operation":"","parent":"","public_key":"029098db8de1073bd53d537628acf4d811cf798feea7e0205c6304ad6c63cfaf77","query":{},"resource":"User","signature":"f8654cebf89a3199b35e5688d219ac832678ce64604b73f817168bb0fed089e22e4c344d45a8137cd5e0eeef0c83aeccedb9917d0aa1b397d057d46e9b708018","treasury":"Qj3uUa7fhAcrDsFWwRSzVN","vote":""},"state":"authorizing","update_time":"2024-06-05T22:55:43Z","version":1}}
        {"height":176,"time":"2024-06-05T22:55:43Z","action":"create","type":"User","resource":{"create_time":"2024-06-05T22:55:43Z","name":"users/machine","roles":[],"update_time":"2024-06-05T22:55:43Z","variant":"machine","version":1}}
        ```

        Entries for `type` not `Operation` correspond to changes in resources.
        Entries for `type` `Operation` allow tracking requests.
      operationId: ws-events
      responses: {}
      servers:
        - url: 'https://treasury.cordialapis.com/v1'
          description: Production
        - url: 'http://localhost:8777/v1'
          description: Development (port TRSR)
  /healthy:
    get:
      tags:
        - Observability
      summary: Healthy
      description: |-
        Called directly, this endpoint returns an auto-refreshing HTML page,
        which is green (HTTP 200) if all checks passed,
        and red (HTTP 503) is any checks failed.

        A correct monitoring client SHOULD call the endpoint unadorned, and alert:
        - when request itself fails, or
        - when the HTTP status code is not 200

        Infrastructure operators can then use the verbose output to resolve the issue(s).

        ### Details
        With the query parameter `?verbose`, it returns JSON data with
        all checks and their outcomes for all checked components.

        **The content of this "verbose" output is currently NOT AT ALL covered by API stability guarantees.**

        Example:
        ```json
        {
          "api": {
            "pass": []
          },
          "backup": {
            "pass": [
              "snapshot"
            ]
          },
          "connector": {
            "pass": [
              "enrolled",
              "treasury"
            ],
            "fail": {
              "oracle-api": "could not use oracle API: Unauthenticated: Neither access token nor API key passed"
            }
          },
          "engine": {
            "pass": [
              "consensus",
              "time",
              "validators"
            ]
          },
          "signer": {
            "pass": [
              "enrolled",
              "s2s-connectivity-1-2",
              "treasury"
            ]
          }
        }
        ```
      operationId: healthy
      parameters:
        - name: verbose
          in: query
          description: 'set this parameter to see the underlying checks, and reasons for the fails'
          schema:
            type: string
      responses:
        '200':
          description: Treasury is healthy
          content:
            text/html:
              schema:
                type: object
        '503':
          description: Treasury is not healthy
      servers:
        - url: 'https://treasury.cordialapis.com/v1'
          description: Production
        - url: 'http://localhost:8777/v1'
          description: Development (port TRSR)
